name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-lint:
    name: Server — lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morphyverse-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .

  server-docker:
    name: Server — Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t morphyverse-server ./morphyverse-server

  inference-lint:
    name: Inference — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morphyverse-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Lint (ruff)
        run: ruff check .

  pwa-build:
    name: PWA — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morphyverse-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: morphyverse-pwa/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.example.com
